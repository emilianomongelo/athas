[package]
name = "athas-database"
version = "0.1.0"
edition = "2024"

[lib]
name = "athas_database"
path = "src/lib.rs"

[[bin]]
name = "athas-db-sqlite"
path = "src/bin/athas-db-sqlite.rs"
required-features = ["sqlite"]

[[bin]]
name = "athas-db-duckdb"
path = "src/bin/athas-db-duckdb.rs"
required-features = ["duckdb"]

[[bin]]
name = "athas-db-postgres"
path = "src/bin/athas-db-postgres.rs"
required-features = ["postgres"]

[[bin]]
name = "athas-db-mysql"
path = "src/bin/athas-db-mysql.rs"
required-features = ["mysql"]

[[bin]]
name = "athas-db-mongodb"
path = "src/bin/athas-db-mongodb.rs"
required-features = ["mongodb"]

[[bin]]
name = "athas-db-redis"
path = "src/bin/athas-db-redis.rs"
required-features = ["redis"]

[[bin]]
name = "athas-db-snowflake"
path = "src/bin/athas-db-snowflake.rs"
required-features = ["snowflake"]

[features]
default = ["sqlite"]
all-providers = ["duckdb", "mongodb", "mysql", "postgres", "redis", "snowflake", "sqlite"]
duckdb = ["dep:duckdb"]
mongodb = ["dep:mongodb"]
mysql = ["dep:sqlx"]
postgres = ["dep:sqlx"]
redis = ["dep:redis"]
snowflake = ["dep:jsonwebtoken", "dep:reqwest", "dep:sha2", "dep:rsa", "dep:base64ct"]
sqlite = ["dep:rusqlite"]

[dependencies]
base64ct = { version = "1", optional = true }
duckdb = { version = "1.4.4", features = ["bundled"], optional = true }
futures-util = "0.3"
jsonwebtoken = { version = "9", optional = true }
mongodb = { version = "3.5.1", optional = true }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rsa = { version = "0.9", optional = true, default-features = false, features = ["std", "pem"] }
rusqlite = { version = "0.29.0", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
], optional = true }
tokio = { version = "1.0", features = ["full"] }
